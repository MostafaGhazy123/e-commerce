<ngx-spinner bdColor="rgba(255,255,255,0.9)" size="large" color="#0aad0a" type="ball-clip-rotate-multiple"
    [fullScreen]="true"></ngx-spinner>

@if (isProduct) {
<section class="container py-4">
    <div class="row align-items-center">

        <!-- Product Image -->
        <div class="col-12 col-md-6">
            <div id="carouselExampleIndicators" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img [src]="product?.imageCover" class="img-fluid w-100">
                    </div>
                    @for(img of product?.images; track $index) {

                    <div class="carousel-item">
                        <img [src]="img" class="img-fluid w-100">
                    </div>
                    }
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <!-- Product Info -->
        <div class="col-12 col-md-6 d-flex flex-column justify-content-center">
            <h2 class="text-main mb-2">{{ product?.title }}</h2>
            <h3 class="mb-2">{{ product?.brand.name }}</h3>
            <p class="text-secondary mb-2 small">{{ product?.category.name }}</p>
            <p class="mb-3 small">{{ product?.description }}</p>

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-2">
                <p class="mb-0 fs-5 fw-bold">{{ product?.price }} EGP</p>
                <p class="mb-0 fs-6 d-flex align-items-center gap-1">
                    <i class="fa-solid fa-star rating-color"></i>{{ product?.ratingsAverage }}
                </p>
            </div>

            <button class="custom-btn w-100 w-sm-auto">Add to Cart</button>
        </div>

    </div>
</section>
} @else {
<div class="container py-5">
    <div class="alert alert-danger text-center" role="alert">
        Product not found!
    </div>
</div>
}
